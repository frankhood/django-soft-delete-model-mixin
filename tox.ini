[tox]
envlist =
    {py310,py311,py312,py313,py314}-django52
    {py310,py311,py312,py313}-django51
    {py310,py311,py312}-django50
    {py38,py39,py310,py311}-django42

[testenv]
setenv =
    PYTHONPATH = {toxinidir}:{toxinidir}/soft_delete_model_mixin
commands = coverage run --source soft_delete_model_mixin runtests.py
deps =
    django42: Django>=4.2,<4.3
    django50: Django>=5.0,<5.1
    django51: Django>=5.1,<5.2
    django52: Django>=5.2,<5.3
    -r{toxinidir}/requirements_test.txt
basepython =
    py314: python3.14
    py313: python3.13
    py312: python3.12
    py311: python3.11
    py310: python3.10
    py39: python3.9
    py38: python3.8
