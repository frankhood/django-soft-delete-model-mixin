services:
  tox:
    build: .
    # Passa --parallel auto: tox esegue tutti gli env contemporaneamente
    command: tox --parallel auto --parallel-live
    volumes:
      - .:/app
      # Cache tox/pip separata per non sovrascrivere quella locale
      - tox-cache:/app/.tox
      - pip-cache:/root/.cache/pip

volumes:
  tox-cache:
  pip-cache:
